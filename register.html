<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>User Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
      <style>

body{
    background:#f4f6f9;
}

.card{
    border-radius:15px;
}

</style>

</head>

<body>
<h2 class="text-center mb-4 fw-bold">
    Registration Form
</h2>
<div class="container d-flex justify-content-center">

    <div class="card shadow p-4 mt-5"
         style="width:500px;">

    <div th:if="${success}"
     class="alert alert-success">

    <span th:text="${success}"></span>

</div>

        <form th:action="@{/register}"
      th:object="${user}"
      method="post">

    <div class="mb-3">

        <label>Username</label>

        <input type="text"
               th:field="*{username}"
               class="form-control">

    </div>

    <div class="mb-3">

        <label>Email</label>

        <input type="email"
               th:field="*{email}"
               class="form-control">

    </div>

    <div class="mb-3">

        <label>Password</label>

        <input type="password"
               th:field="*{password}"
               class="form-control">

    </div>

    <div class="mb-3">

        <label>Role</label>

        <select th:field="*{role}"
                class="form-control">

            <option value="ADMIN">
                ADMIN
            </option>

            <option value="MEMBER">
                MEMBER
            </option>

        </select>

    </div>

    <button type="submit"
            class="btn btn-primary">

        Register

    </button>
    <div class="text-center mt-3">

    <a href="/login">

        Already Registered?
        Login Here

    </a>

</div>

</form>

    </div>

</div>

</body>
</html>
