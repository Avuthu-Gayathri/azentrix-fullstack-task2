<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.card{
    border-radius:15px;
}

</style>

</head>

<body>

<div class="container d-flex justify-content-center">

    <div class="card shadow p-4 mt-5"
         style="width:500px;">

        <h2 class="text-center mb-4 fw-bold">
            Login
        </h2>

        <div th:if="${error}"
             class="alert alert-danger">

            <span th:text="${error}"></span>

        </div>

        <form th:action="@{/login}"
              method="post">

            <div class="mb-3">

                <label>Email</label>

                <input type="email"
                       name="email"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label>Password</label>

                <input type="password"
                       name="password"
                       class="form-control"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-primary w-100">

                Login

            </button>

        </form>

        <div class="text-center mt-3">

            <a href="/">
                New User? Register Here
            </a>

        </div>

    </div>

</div>

</body>

</html>
