<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background:#f4f6f9;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0px 4px 12px rgba(0,0,0,0.15);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.navbar-brand{
    font-weight:bold;
}

.stat-number{
    font-size:40px;
    font-weight:bold;
}

.welcome-banner{
    background:linear-gradient(135deg,#0d6efd,#0dcaf0);
    color:white;
    border-radius:15px;
    padding:30px;
    margin-bottom:30px;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand">
            Task Management System
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link active" href="/dashboard">
                Dashboard
            </a>

            <a class="nav-link" href="/add-task">
                Add Task
            </a>

            <a class="nav-link" href="/tasks">
                View Tasks
            </a> 
            <a class="nav-link" href="/logout">
             Logout </a>

			</div>

    </div>

</nav>

<div class="container mt-4">

    <div class="welcome-banner">

        <h2>
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </h2>

        <p class="mb-0">
            Manage your tasks efficiently and track progress.
        </p>

    </div>

    <div class="row g-4">

        <div class="col-md-3">

            <div class="card text-center p-4">

                <h5>Total Tasks</h5>

                <div class="stat-number text-primary"
                     th:text="${totalTasks}">
                    0
                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-center p-4">

                <h5>Pending</h5>

                <div class="stat-number text-warning"
                     th:text="${pendingTasks}">
                    0
                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-center p-4">

                <h5>In Progress</h5>

                <div class="stat-number text-info"
                     th:text="${inProgressTasks}">
                    0
                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-center p-4">

                <h5>Completed</h5>

                <div class="stat-number text-success"
                     th:text="${completedTasks}">
                    0
                </div>

            </div>

        </div>

    </div>

    <!-- TEST VALUES -->

    <div class="card mt-4 p-4">

        <h4>Testing Counts</h4>

        <h3 th:text="${pendingCount}"></h3>

        <h3 th:text="${progressCount}"></h3>

        <h3 th:text="${completedCount}"></h3>

    </div>

    <!-- RECENT TASKS -->

    <div class="card mt-4 p-4">

        <h4>
            Recent Tasks
        </h4>

        <table class="table table-hover">

            <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Title</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

                <tr th:each="task : ${recentTasks}">

                    <td th:text="${task.id}"></td>

                    <td th:text="${task.title}"></td>

                    <td th:text="${task.status}"></td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</table>

</div>

<!-- Recent Tasks Card Ends -->

<div class="card mt-4 p-4">

    <h4>
        <i class="bi bi-bar-chart-fill text-success"></i>
        Task Statistics
    </h4>

   <div style="height:300px;">
    <canvas id="taskChart"></canvas>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script th:inline="javascript">

const pending = [[${pendingCount}]];
const progress = [[${progressCount}]];
const completed = [[${completedCount}]];

new Chart(
    document.getElementById('taskChart'),
    {
        type: 'bar',

        data: {
            labels: [
                'Pending',
                'In Progress',
                'Completed'
            ],

            datasets: [{
                label: 'Tasks',
                data: [
                    pending,
                    progress,
                    completed
                ],
                backgroundColor: [
                    '#ffc107',
                    '#0dcaf0',
                    '#198754'
                ]
            }]
        },

        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: false
                }
            }
        }
    }
);

</script>

</body>
</html>
</body>
</html>
